# golangci-lint configuration (v2 format). Docs: https://golangci-lint.run
version: "2"

linters:
  # "standard" enables: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose # HTTP response bodies must be closed
    - errorlint # compare errors with errors.Is/As, not ==
    - gosec # security checks
    - misspell # common English misspellings in comments and strings
    - revive # Go naming and style conventions
  settings:
    misspell:
      locale: US
      # Spanish words in place names that look like English misspellings.
      ignore-rules:
        - dependencias
  exclusions:
    rules:
      # Tests may use patterns gosec flags in production code.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Group this project's imports separately from third-party ones.
      local-prefixes:
        - github.com/esrichardd/datosvenezuela
